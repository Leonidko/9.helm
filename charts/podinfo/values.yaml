replicaCount: 1
auth:
  password:
image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9898

ingress:
  enabled: false
  className: ""
  host: podinfo.local
  paths: /

resourses:
  limit:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

podinfo:
  level: info
  message: "Hello from my Helm chart!"
  ui:
    color: "#34577c"

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14
  auth:
    username: podinfo
    password: changeme
    database: podinfo
  primary:
    persistence:
      enabled: false      # для теста, в проде true
