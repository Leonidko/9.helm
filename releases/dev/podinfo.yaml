replicaCount: 3

image:
  pullPolicy: Always

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi

podinfo:
  level: debug
  message: "DEV v3 -- with diff!"
  ui:
    color: "#ffd43b"     # жёлтый для diff

ingress:
  enabled: true
  host: podinfo-dev.local
